# Il sito si builda in locale (make / C-c c c) e _build/ è committata:
# Netlify pubblica la cartella così com'è, senza comandi di build.
[build]
  publish = "_build"
  command = ""

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
